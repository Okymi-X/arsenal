[[tool]]
name = "pypykatz"
aliases = []
description = "Pure-Python implementation of Mimikatz"
repo = "https://github.com/skelsec/pypykatz"
homepage = "https://github.com/skelsec/pypykatz"
category = "password"
install_method = "pip"
python_version = ">=3.6"
binary = "pypykatz"
tags = ["lsass", "mimikatz", "credentials", "dpapi"]
requires_root = false
notes = "Parses lsass dumps, registry hives, and DPAPI blobs offline to recover secrets."

  [[tool.version]]
  tag = "0.6.13"
  commit = ""
  tested = true
  pip_spec = "pypykatz==0.6.13"
  date = "2026-01-02"
  notes = "Current stable release."

