# arsenal registry segment: Network reconnaissance and service auditing

[[tool]]
name = "bbot"
aliases = []
description = "Recursive OSINT and attack-surface reconnaissance framework"
repo = "https://github.com/blacklanternsecurity/bbot"
homepage = "https://www.blacklanternsecurity.com/bbot/"
category = "recon"
install_method = "pip"
python_version = ">=3.10,<3.15"
binary = "bbot"
tags = ["osint", "subdomain", "attack-surface", "recon", "web"]
requires_root = false
notes = "Core installs in isolation; individual modules may need API keys, external executables, or explicit active-scan authorization."

  [[tool.version]]
  tag = "3.0.2"
  commit = ""
  tested = true
  pip_spec = "bbot==3.0.2"
  date = "2026-08-24"
  notes = "Clean install and CLI startup verified with Python 3.14."

