name: Registry check

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "tools/regcheck/**"
      - "tools/regbuild/**"
      - ".github/workflows/registry-check.yml"
  pull_request:
    paths:
      - "registry/**"
      - "tools/regcheck/**"
      - "tools/regbuild/**"
  schedule:
    # Weekly bot run: catch upstream versions that were yanked or moved.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify registry versions exist upstream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate registry manifest and segments
        run: go run ./tools/regbuild -verify
      - name: Verify against PyPI and GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./tools/regcheck -registry registry/registry.toml
