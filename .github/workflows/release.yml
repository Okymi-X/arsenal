name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}"
            exit 1
          fi
          if ! grep -Fq "## [$version] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no dated entry for ${GITHUB_REF_NAME}"
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit is not on main"
            exit 1
          fi

      - name: Verify dependencies
        run: go mod verify

      - name: Cross-compile static binaries
        run: make release

      - name: Generate checksums
        working-directory: bin
        run: sha256sum arsenal-* > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            bin/arsenal-* bin/SHA256SUMS \
            --title "arsenal ${GITHUB_REF_NAME}" \
            --generate-notes
